#brand { --w: min(78vw, 52vh, 560px); width: var(--w); margin-top: 5vh; display: flex; flex-direction: column; align-items: center; }
#emblem { width: calc(var(--w) * 0.42); height: auto; overflow: visible; }
#logo { width: var(--w); margin-top: calc(var(--w) * 0.03); }
#bottom { width: min(86vw, 420px); margin-bottom: 6vh; text-align: center; }
#title { color: #f3efe6; font-weight: 800; letter-spacing: 0.08em; font-size: 15px; margin-bottom: 6px; }
#tip { font-size: 14px; line-height: 1.35; text-shadow: 0 1px 2px rgba(0,0,0,0.6); min-height: 2.7em; }
/* emblem parts, in a 240 x 240 box centred on the tower */
#orbit { animation: orbit 3.927s linear infinite; }           /* 1.6 rad/s, like the game */
@keyframes orbit { to { transform: rotate(360deg); } }
#ring { transform: rotate(-90deg); transition: stroke-dashoffset 0.3s ease-out; }
#ring.spin { stroke-dasharray: 22 78; animation: ringspin 1.5s linear infinite; transition: none; }
@keyframes ringspin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
#head { transform: rotate(-90deg); transition: transform 0.3s ease-out; }
#head circle:first-child { animation: pulse 0.8s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 0.25; } to { opacity: 0.55; } }
#ring.spin + #head { display: none; }
#notice { display: none; margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(169,52,42,0.9);
  font-size: 14px; white-space: pre-line; }
</style>

    <div id="title">LOADING</div>

    <div id="notice"></div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
(function () {
  const TIPS = [
    "Hook the tower as you enter the bend, let go when your nose points down the exit.",
    "Rubbing the rail cuts your throttle. Let go a touch earlier to stay off it.",
    "Every bend has its own tower. The rope keeps its length, so grab timing sets your line.",
    "After you let go the car slides a little on the ice. Aim for it.",
    "Beat a medal time to unlock the next campaign event.",
  ];
  const status = document.getElementById("status");
  const ring = document.getElementById("ring");
  const head = document.getElementById("head");
  const emblem = document.getElementById("emblem");
  // the emblem's ring fills clockwise from the top; without a known size it spins instead
  function progress(f) {
    ring.classList.remove("spin");
    ring.style.strokeDashoffset = String(100 - f * 100);
    head.style.transform = "rotate(" + (-90 + 360 * f) + "deg)";
    emblem.setAttribute("aria-valuenow", String(Math.round(f * 100)));
  }
  const notice = document.getElementById("notice");
  document.getElementById("tip").textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
  status.style.visibility = "visible";

  let handedOver = false;
  window.tetherReady = function () {
    if (handedOver) return;
    handedOver = true;
    status.style.opacity = "0";
    setTimeout(function () { status.style.visibility = "hidden"; }, 450);
  };

  function fail(err) {
    const msg = err && err.message ? err.message : String(err);
    console.error(msg);
    ring.classList.remove("spin");
    ring.style.stroke = "#a9342a";
    ring.style.strokeDashoffset = "0";
    head.style.display = "none";
    notice.style.display = "block";
    notice.textContent = msg;
    engine.unload && engine.unload();
  }
  // this build runs without threads, so it needs no cross-origin isolation
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length !== 0) {
    fail("Your browser is missing features this game needs:\n" + missing.join("\n"));
    return;
  }
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        // the download fills the first half of the ring; the game's own loading screen
        // picks up at half (main.gd WEB_HANDOFF) and fills the rest
        progress(Math.max(0.04, Math.min(1, current / total)) * 0.5);
      } else {
        ring.classList.add("spin");
      }
    },
  }).then(function () {
    // the engine is up; keep this page until the game has drawn its own loading screen
    // (main.gd calls window.tetherReady), so nothing shows in between the two
    progress(0.5);
    setTimeout(window.tetherReady, 15000);   // safety net if that call never comes
  }, fail);
}());
</script>
